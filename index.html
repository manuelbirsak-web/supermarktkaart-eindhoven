<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Supermarktkaart Eindhoven</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;color:#18212b}header{padding:14px 18px;background:#18212b;color:#fff}h1{font-size:22px;margin:0}header p{margin:5px 0}main{display:grid;grid-template-columns:270px 1fr;min-height:85vh}aside{padding:16px;border-right:1px solid #ddd}.key{display:flex;align-items:center;gap:9px;margin:12px 0}.dot{width:13px;height:13px;border-radius:50%}label{display:block;margin:15px 0;font-weight:600}input[type=range]{width:100%}button{padding:10px;border:0;border-radius:7px;background:#18212b;color:white;font-weight:600;width:100%;margin:6px 0}#map{height:85vh;min-height:500px}.small{font-size:12px;color:#52606c}@media(max-width:750px){main{display:flex;flex-direction:column}#map{height:62vh;min-height:400px}aside{order:2;border-right:0;border-top:1px solid #ddd}}
</style></head>
<body><header><h1>Supermarkten rond Eindhoven</h1><p>Interactieve kaart · straal instelbaar van 5 tot 30 km</p></header>
<main><aside><b>Supermarktfilialen</b>
<div class="key"><span class="dot" style="background:#1688e8"></span>Albert Heijn</div><div class="key"><span class="dot" style="background:#f5cf19;border:1px solid #777"></span>Lidl</div><div class="key"><span class="dot" style="background:#ed3434"></span>Jumbo</div>
<label><input id="ah" type="checkbox" checked> Albert Heijn</label><label><input id="lidl" type="checkbox" checked> Lidl</label><label><input id="jumbo" type="checkbox" checked> Jumbo</label>
<label>Straal: <span id="rv">15 km</span><input id="radius" type="range" min="5" max="30" step="5" value="15"></label>
<button id="reload">Filialen opnieuw laden</button><button id="share">Kopieer deel-link</button><div id="counts">Kaart initialiseren…</div><p class="small" id="status">Filialen worden opgehaald uit OpenStreetMap. Registraties kunnen onvolledig of verouderd zijn.</p><p class="small">Kaartgegevens: © OpenStreetMap-bijdragers.</p></aside><div id="map"></div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const center=[51.4416,5.4697],names={ah:'Albert Heijn',lidl:'Lidl',jumbo:'Jumbo'},colors={ah:'#1688e8',lidl:'#f5cf19',jumbo:'#ed3434'},$=id=>document.getElementById(id);
const map=L.map('map').setView(center,11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
L.marker(center).addTo(map).bindPopup('Eindhoven — middelpunt');const ring=L.circle(center,{radius:15000,color:'#273747',dashArray:'6 6',fillOpacity:.04}).addTo(map);let data=[],marks=L.layerGroup().addTo(map);
function brand(t){const s=[t.brand,t.name,t.operator].filter(Boolean).join(' ').toLowerCase();if(s.includes('albert heijn')||s.includes('ah xl'))return'ah';if(s.includes('lidl'))return'lidl';if(s.includes('jumbo'))return'jumbo';return null}
function dist(a,b){const R=6371,p=x=>x*Math.PI/180,dl=p(b[0]-a[0]),dn=p(b[1]-a[1]),v=Math.sin(dl/2)**2+Math.cos(p(a[0]))*Math.cos(p(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(v))}
function draw(){marks.clearLayers();const r=+$('radius').value,n={ah:0,lidl:0,jumbo:0};ring.setRadius(r*1000);$('rv').textContent=r+' km';data.filter(s=>$(s.brand).checked&&dist(center,[s.lat,s.lon])<=r).forEach(s=>{n[s.brand]++;L.circleMarker([s.lat,s.lon],{radius:7,color:'#fff',weight:1,fillColor:colors[s.brand],fillOpacity:1}).addTo(marks).bindPopup('<b>'+s.name+'</b><br>'+names[s.brand]+'<br>'+(s.address||'Adres niet vermeld')+'<br>'+dist(center,[s.lat,s.lon]).toFixed(1)+' km hemelsbreed')});$('counts').textContent='Getoond: '+(n.ah+n.lidl+n.jumbo)+' · AH '+n.ah+' · Lidl '+n.lidl+' · Jumbo '+n.jumbo;const u=new URL(location.href);u.searchParams.set('radius',r);u.searchParams.set('brands',['ah','lidl','jumbo'].filter(x=>$(x).checked).join(','));history.replaceState(null,'',u)}
async function load(){ $('status').textContent='Locaties ophalen…';const q='[out:json][timeout:18];nwr(around:30000,51.4416,5.4697)["shop"="supermarket"];out center tags;';let err='';const target='https://overpass.kumi.systems/api/interpreter?data='+encodeURIComponent(q);for(const request of [target,'https://corsproxy.io/?url='+encodeURIComponent(target),'https://api.allorigins.win/raw?url='+encodeURIComponent(target),'https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q)]){let timer;try{const ctl=new AbortController();timer=setTimeout(()=>ctl.abort(),22000);const res=await fetch(request,{method:'GET',signal:ctl.signal});clearTimeout(timer);if(!res.ok)throw Error('HTTP '+res.status);const j=await res.json(),seen=new Set(),out=[];for(const e of j.elements||[]){const t=e.tags||{},b=brand(t),lat=e.lat??e.center?.lat,lon=e.lon??e.center?.lon;if(!b||lat==null||lon==null||dist(center,[lat,lon])>30)continue;const key=b+'|'+lat.toFixed(5)+'|'+lon.toFixed(5);if(seen.has(key))continue;seen.add(key);out.push({brand:b,lat,lon,name:t.name||names[b],address:[t['addr:street'],t['addr:housenumber'],t['addr:postcode'],t['addr:city']].filter(Boolean).join(' ')})}if(out.length===0)throw Error('geen herkenbare supermarktfilialen gevonden');data=out;draw();$('status').textContent=data.length+' mogelijke filialen binnen 30 km gevonden. OpenStreetMap kan onvolledig zijn.';return}catch(e){clearTimeout(timer);err=e.name==='AbortError'?'time-out':e.message; $('status').textContent='Bron reageert niet ('+err+'); volgende bron proberen…'}}$('status').textContent='Ophalen mislukt ('+err+'). Tik op “Filialen opnieuw laden” om opnieuw te proberen.'}
['ah','lidl','jumbo'].forEach(x=>$(x).addEventListener('change',draw));$('radius').addEventListener('input',draw);$('reload').onclick=load;$('share').onclick=async()=>{const u=new URL(location.href);u.searchParams.set('radius',$('radius').value);u.searchParams.set('brands',['ah','lidl','jumbo'].filter(x=>$(x).checked).join(','));try{await navigator.clipboard.writeText(u.href);$('status').textContent='Deel-link gekopieerd.'}catch(e){prompt('Kopieer deze link',u.href)}};const p=new URLSearchParams(location.search);if(p.has('radius'))$('radius').value=Math.max(5,Math.min(30,+p.get('radius')||15));if(p.has('brands'))['ah','lidl','jumbo'].forEach(x=>$(x).checked=p.get('brands').split(',').includes(x));draw();load();
</script></body></html>
